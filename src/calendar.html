<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/calendario/calendario.css">
    <title>Calendário</title>
</head>
<body>
    <header>
        <img class="logo" src="assets/icons/logo.svg" alt="Logo Deskly">
        <div class="header-icons">
            <button><img class="header-icon" src="assets/icons/bell.svg" alt="Sino"></button>
            <button><img class="header-icon" src="assets/icons/user-circle.svg" alt="Perfil"></button>
            <button type="button" id="btn-hamburguer" class="hamburguer">
                <img src="assets/icons/menu.svg" alt="Botão">
            </button>
        </div>
    </header>

    <aside>
        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#" class="active">Calendário</a></li>
                <li><a href="#">Salas de Reunião</a></li>
                <li><a href="#">Estações de Trabalho</a></li>
                <li><a href="#">Minhas Reservas</a></li>
            </ul>
            <ul>
                <li><a href="#">Painel Admin</a></li>
                <li><a href="#">Ajuda</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <section class="calendar-page">

            <div class="calendar-page-header">
                <div class="calendar-title">
                    <h1>Calendário</h1>
                    <span class="subtitle">Visualize e gerencie suas reservas</span>
                </div>
                <div class="calendar-nav">
                    <button onclick="mudarMes(-1)">&#8249;</button>
                    <span id="mesLabel"></span>
                    <button onclick="mudarMes(1)">&#8250;</button>
                </div>
            </div>

            <div class="calendar-grid-wrapper">
                <div class="week-header">
                    <span>Dom</span>
                    <span>Seg</span>
                    <span>Ter</span>
                    <span>Qua</span>
                    <span>Qui</span>
                    <span>Sex</span>
                    <span>Sáb</span>
                </div>
                <div id="calendar"></div>
            </div>

        </section>
    </main>

    <!-- Modal: Nova / Editar reserva -->
    <dialog id="modal">
        <form>
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Nova Reserva</h3>
                <button class="close-modal" type="button" onclick="fechar()">
                    <img src="assets/icons/close-menu.svg" alt="Fechar">
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="espaco">Espaço</label>
                    <select id="espaco" name="espaco">
                        <option value="">Selecione um espaço</option>
                        <option value="Sala A">Sala A — cap. 4 pessoas</option>
                        <option value="Sala B">Sala B — cap. 8 pessoas</option>
                        <option value="Sala C">Sala C — cap. 12 pessoas</option>
                        <option value="Estação A">Estação A</option>
                        <option value="Estação B">Estação B</option>
                        <option value="Estação C">Estação C</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="data">Data</label>
                    <input type="date" id="data">
                </div>
                <div class="input-group">
                    <label for="inicio">Horário de início</label>
                    <input type="time" id="inicio">
                </div>
                <div class="input-group">
                    <label for="fim">Horário de término</label>
                    <input type="time" id="fim">
                </div>
                <div class="input-group">
                    <label for="responsavel">Responsável</label>
                    <input type="text" id="responsavel" placeholder="Nome do responsável">
                </div>
                <div class="input-group">
                    <label for="emails">Convidados <small>(e-mails separados por vírgula, máx. 3)</small></label>
                    <input type="text" id="emails" placeholder="email1@exemplo.com, email2@exemplo.com">
                </div>
                <div class="input-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Confirmado">Confirmado</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="fechar()">Cancelar</button>
                <button type="button" onclick="salvar()">Confirmar</button>
            </div>
        </form>
    </dialog>

    <!-- Modal: Visualizar reserva -->
    <dialog id="viewModal">
        <div>
            <div class="modal-header">
                <h3 class="modal-title" id="titulo"></h3>
                <button class="close-modal" type="button" onclick="fecharView()">
                    <img src="assets/icons/close-menu.svg" alt="Fechar">
                </button>
            </div>
            <div class="modal-body">
                <p id="horario"></p>
                <p id="respView"></p>
                <p id="statusView"></p>
                <div id="listaEmails"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-delete" onclick="excluir()">Excluir</button>
                <button type="button" onclick="fecharView()">Fechar</button>
                <button type="button" onclick="editar()">Editar</button>
            </div>
        </div>
    </dialog>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/calendario.js"></script>
</body>
</html>
