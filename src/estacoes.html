<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/estacoes/estacoes.css">

    <title>Estações de Trabalho</title>
</head>

<body>

    <header id="header"></header>
    <aside id="aside"></aside>

    <main>
        <section class="estacoes">

            <div class="estacoes-header">
                <div>
                    <h1>Estações de Trabalho</h1>
                    <span class="subtitle">Reserve sua mesa para o dia</span>
                </div>

                <button class="btn-primary open-modal" data-modal="modal-1">
                    + Nova Reserva
                </button>
            </div>

            <div class="filtro-data">

                <div class="date-wrapper">
                    <input type="text" class="date-input" placeholder="dd/mm/aaaa">
                    <img src="assets/icons/calendar-dots.svg" class="calendar-icon">
                </div>

                <button class="btn-filtrar">Filtrar</button>

            </div>

            <div class="estacoes-lista">

                <div class="estacao-card">
                    <div class="estacao-info">
                        <img class="estacao-icon"
                            src="assets/images/Mesa 01.png"
                            alt="Mesa 01">
                        <div>
                            <h4>Mesa 01</h4>
                            <span class="subtitle">Área: Andar 1 - Ala A</span>
                        </div>
                    </div>
                    <div class="estacao-acoes">
                        <span class="badge disponivel">Disponível</span>
                        <button class="fast-action-btn open-modal" data-modal="modal-1">Reservar</button>
                    </div>
                </div>

                <div class="estacao-card">
                    <div class="estacao-info">
                        <img class="estacao-icon"
                            src="assets/images/Mesa 02.png"
                            alt="Mesa 02">
                        <div>
                            <h4>Mesa 02</h4>
                            <span class="subtitle">Área: Andar 2 - Ala B</span>
                        </div>
                    </div>
                    <div class="estacao-acoes">
                        <span class="badge ocupado">Ocupada</span>
                        <button class="fast-action-btn" disabled>Reservar</button>
                    </div>
                </div>

                <div class="estacao-card">
                    <div class="estacao-info">
                        <img class="estacao-icon"
                            src="assets/images/Mesa 03.png"
                            alt="Mesa 03">
                        <div>
                            <h4>Mesa 03</h4>
                            <span class="subtitle">Área: Andar 3 - Ala C</span>
                        </div>
                    </div>
                    <div class="estacao-acoes">
                        <span class="badge inativa">Inativa</span>
                        <button class="fast-action-btn" disabled>Reservar</button>
                    </div>
                </div>

                <div class="estacao-card">
                    <div class="estacao-info">
                        <img class="estacao-icon"
                            src="assets/images/Mesa 04.png"
                            alt="Mesa 04">
                        <div>
                            <h4>Mesa 04</h4>
                            <span class="subtitle">Área: Andar 4 - Ala D</span>
                        </div>
                    </div>
                    <div class="estacao-acoes">
                        <span class="badge disponivel">Disponível</span>
                        <button class="fast-action-btn open-modal" data-modal="modal-1">Reservar</button>
                    </div>
                </div>

            </div>

        </section>
    </main>

    <dialog id="modal-1">
        <form>

            <div class="modal-header">
                <h3>Nova reserva</h3>
                <button class="close-modal" data-modal="modal-1" type="button">
                    <img src="assets/icons/close-menu.svg" alt="Fechar">
                </button>
            </div>

            <div class="modal-body">

                <div class="input-group">
                    <label>Estação de trabalho</label>
                    <select>
                        <option>Mesa 01 — Andar 1 - Ala A</option>
                        <option>Mesa 02 — Andar 2 - Ala B</option>
                        <option>Mesa 03 — Andar 3 - Ala C</option>
                        <option>Mesa 04 — Andar 4 - Ala D</option>
                    </select>
                </div>

                <div class="input-group" style="position: relative;">
                    <label>Data</label>
                    <input type="text" class="modal-date-input" placeholder="dd/mm/aaaa">
                </div>

                <div class="input-group">
                    <label>Início</label>
                    <input type="time">
                </div>

                <div class="input-group">
                    <label>Fim</label>
                    <input type="time">
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="close-modal" data-modal="modal-1">Cancelar</button>
                <button type="button">Confirmar</button>
            </div>

        </form>
    </dialog>

    <script src="assets/js/partes/menu.js"></script>
    <script src="assets/js/modal/modal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    
    <script>
        flatpickr('.date-input', {
            locale: 'pt',
            dateFormat: 'd/m/Y',
            disableMobile: true,
            placeholder: 'dd/mm/aaaa',
            monthSelectorType: 'static'
        });

        flatpickr('.modal-date-input', {
            locale: 'pt',
            dateFormat: 'd/m/Y',
            disableMobile: true,
            placeholder: 'dd/mm/aaaa',
            monthSelectorType: 'static',
            static: true 
        });
    </script>

</body>

</html
