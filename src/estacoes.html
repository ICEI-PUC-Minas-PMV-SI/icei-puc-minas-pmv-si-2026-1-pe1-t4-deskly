<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/estacoes/estacoes.css">

    <title>Estações de Trabalho</title>
</head>

<body>

    <header id="header"></header>
    <aside id="aside"></aside>

    <main>
        <section class="estacoes">

            <div class="estacoes-header">
                <div>
                    <h1>Estações de Trabalho</h1>
                    <span class="subtitle">Reserve sua mesa para o dia</span>
                </div>

                <button class="btn-primary open-modal" data-modal="modal-1">
                    + Nova Reserva
                </button>
            </div>

            <div class="filtro-data">
                <div class="date-wrapper">
                    <input type="text" class="date-input" placeholder="dd/mm/aaaa">
                    <img src="assets/icons/calendar-dots.svg" class="calendar-icon">
                </div>
                <div class="time-wrapper">
                    <input type="time" class="filtro-inicio">
                </div>
                <div class="time-wrapper">
                    <input type="time" class="filtro-fim">
                </div>
                <button class="btn-filtrar">Filtrar</button>
            </div>

            <div class="estacoes-lista"></div>

        </section>
    </main>

    <dialog id="modal-1">
        <form>
            <div class="modal-header">
                <h3>Nova reserva</h3>
                <button class="close-modal" data-modal="modal-1" type="button">
                    <img src="assets/icons/close-menu.svg" alt="Fechar">
                </button>
            </div>

            <div class="modal-body">

                <div class="input-group">
                    <label>Estação de trabalho</label>

                    <select id="select-estacao">
                        <option value="">Selecione a estação</option>
                    </select>
                </div>

                <div class="input-group" style="position: relative;">
                    <label>Data</label>
                    <input type="text" class="modal-date-input" placeholder="dd/mm/aaaa">
                </div>

                <div class="input-group">
                    <label>Início</label>
                    <input type="time" id="estacao-start-time">
                </div>

                <div class="input-group">
                    <label>Fim</label>
                    <input type="time" id="estacao-end-time">
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="close-modal" data-modal="modal-1">Cancelar</button>
                <button type="button" id="btn-confirmar-estacao">Confirmar</button>
            </div>

        </form>
    </dialog>

    <div id="toast-container"></div>

    <script src="assets/js/partes/menu.js"></script>
    <script src="assets/js/partes/notificacoes.js"></script>
    <script src="assets/js/modal/modal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

    <script>
        flatpickr('.date-input', {
            locale: 'pt',
            dateFormat: 'd/m/Y',
            disableMobile: true,
            placeholder: 'dd/mm/aaaa',
            monthSelectorType: 'static'
        });

        flatpickr('.modal-date-input', {
            locale: 'pt',
            dateFormat: 'd/m/Y',
            disableMobile: true,
            placeholder: 'dd/mm/aaaa',
            monthSelectorType: 'static',
            static: true
        });
    </script>

    <script src="assets/js/estacoes/estacoes.js"></script>

</body>

</html>
