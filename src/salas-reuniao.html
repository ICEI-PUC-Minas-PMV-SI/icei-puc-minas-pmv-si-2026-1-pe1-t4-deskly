<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/Deskly.jpeg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/salas-reuniao/salas-reuniao.css">

    <title>Salas de Reunião</title>
</head>

<body>

    <div id="container-avisos"></div>

    <header id="header"></header>
    <aside id="aside"></aside>

    <main>
        <div class="salas-header">
            <div class="titulos">
                <h1>Salas de Reunião</h1>
                <p>Clique em "Detalhes" para ver horários disponíveis</p>
            </div>
            <button class="botao-add-sala open-modal" data-modal="modal-reserva">+ Nova Reserva</button>
        </div>

        <section class="filtros-container">
            <div class="campo-filtro">
                <input type="text" class="date-input" placeholder="dd/mm/aaaa">
                <img src="assets/icons/calendar-dots.svg" class="calendar-icon">
            </div>

            <div class="filtro-horarios">
                <div class="campo-filtro">
                    <input type="time" class="filtro-inicio">
                </div>
                <div class="campo-filtro">
                    <input type="time" class="filtro-fim">
                </div>
            </div>

            <div class="campo-filtro">
                <select class="filtro-capacidade">
                    <option value="todos">Todas as capacidades</option>
                    <option value="4">Até 4 pessoas</option>
                    <option value="8">Até 8 pessoas</option>
                    <option value="8+">Mais de 8 pessoas</option>
                </select>
            </div>

            <button class="btn-filtrar-simples">Filtrar</button>
        </section>

        <section class="lista-salas" id="container-salas"></section>
    </main>

    <dialog id="modal-reserva">
        <form action="">
            <div class="modal-header">
                <h3 class="modal-title">Nova Reserva</h3>
                <button class="close-modal" data-modal="modal-reserva" type="button">
                    <img src="assets/icons/close-menu.svg" alt="Fechar">
                </button>
            </div>

            <div class="modal-body">
                <div class="input-group">
                    <label for="espaco">Salas de Reunião</label>
                    <select id="espaco" name="espaco">
                        <option value="">Selecione o local</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="campo-data">Data</label>
                    <input type="text" id="campo-data" class="modal-date-input" placeholder="dd/mm/aaaa">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="horario-inicio">Início</label>
                        <input type="time" id="horario-inicio">
                    </div>
                    <div class="input-group">
                        <label for="horario-fim">Término</label>
                        <input type="time" id="horario-fim">
                    </div>
                </div>

                <div class="input-group" id="reserva-grupo-convidados">
                    <label>Convidados <span id="reserva-contador-convidados" class="reserva-contador"></span></label>
                    <div class="modal-convidados-lista oculto" id="reserva-lista-convidados"></div>
                    <small id="aviso-limite">Selecione uma sala para ver o limite de convidados.</small>
                </div>

                <div class="input-group" id="reserva-grupo-adicionar">
                    <label>Adicionar convidado</label>
                    <div class="conv-adicionar-row">
                        <select id="reserva-novo-convidado">
                            <option value="">Selecionar usuário...</option>
                        </select>
                        <button type="button" class="conv-adicionar-btn" id="reserva-btn-adicionar">Adicionar</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancelar close-modal" data-modal="modal-reserva">Cancelar</button>
                <button type="button" class="btn-confirmar" id="btn-confirmar-reserva">Confirmar reserva</button>
            </div>
        </form>
    </dialog>

    <dialog id="modal-detalhes">
        <div class="modal-header">
            <h3 class="modal-title" id="detalhes-titulo"></h3>
            <button class="close-modal" data-modal="modal-detalhes" type="button">
                <img src="assets/icons/close-menu.svg" alt="Fechar">
            </button>
        </div>

        <div class="modal-body">
            <div class="detail-row">
                <span class="detail-label">Tipo</span>
                <span class="detail-value" id="detalhes-tipo"></span>
            </div>
             <div class="detail-row">
                <span class="detail-label">Nome</span>
                <span class="detail-value" id="detalhes-nome"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Capacidade</span>
                <span class="detail-value" id="detalhes-capacidade"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Recursos</span>
                <span class="detail-value" id="detalhes-recursos"></span>
            </div>
             <div class="detail-row">
                <span class="detail-label">Área / Local</span>
                <span class="detail-value" id="detalhes-area"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" id="detalhes-status"></span>
            </div>

            <p class="horarios-title">Horários ocupados hoje</p>

            <div id="detalhes-horarios"></div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn-cancelar close-modal" data-modal="modal-detalhes">Fechar</button>
            <button type="button" class="btn-confirmar" id="btn-reservar-dos-detalhes">Reservar este espaço</button>
        </div>
    </dialog>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/partes/menu.js"></script>
    <script src="assets/js/partes/notificacoes.js"></script>
    <script src="assets/js/modal/modal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

    <script>
        flatpickr('.date-input', {
            locale: 'pt',
            dateFormat: 'd/m/Y',
            disableMobile: true,
            placeholder: 'dd/mm/aaaa',
            monthSelectorType: 'static'
        });

        flatpickr('.modal-date-input', {
            locale: 'pt',
            dateFormat: 'd/m/Y',
            minDate: 'today',
            disableMobile: true,
            placeholder: 'dd/mm/aaaa',
            monthSelectorType: 'static',
            static: true
        });
    </script>

    <script src="assets/js/salas-reuniao/salas-reuniao.js"></script>

</body>

</html>
