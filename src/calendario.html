<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/calendario/calendario.css">
    <title>Calendário</title>
</head>

<body>
    <header id="header"></header>
    <aside id="aside"></aside>

    <main>
        <section class="calendar-page">

            <div class="calendar-page-header">
                <div class="calendar-title">
                    <h1>Calendário</h1>
                    <span class="subtitle">Visualize suas reservas</span>
                </div>

                <div class="calendar-nav">
                    <button onclick="mudarMes(-1)">&#8249;</button>
                    <span id="mesLabel"></span>
                    <button onclick="mudarMes(1)">&#8250;</button>
                </div>
            </div>

            <div class="calendar-grid-wrapper">
                <div class="week-header">
                    <span>Dom</span>
                    <span>Seg</span>
                    <span>Ter</span>
                    <span>Qua</span>
                    <span>Qui</span>
                    <span>Sex</span>
                    <span>Sáb</span>
                </div>

                <div id="calendar"></div>
            </div>

        </section>
    </main>

    <dialog id="viewModal">
        <div>
            <div class="modal-header">
                <h3 class="modal-title" id="titulo"></h3>

                <button class="close-modal" type="button" onclick="fecharView()">
                    <img src="assets/icons/close-menu.svg" alt="Fechar">
                </button>
            </div>

            <div class="modal-body">
                <p id="horario"></p>
                <p id="respView"></p>
                
                <p id="capacidadeView" style="margin: 5px 0; font-size: 14px; color: var(--color-text-sm);"></p>
                <p id="areaView" style="margin: 5px 0; font-size: 14px; color: var(--color-text-sm);"></p>
                
                <p id="statusView"></p>
                <div id="listaEmails"></div>
            </div>

            <div class="modal-footer">
                <button type="button" onclick="fecharView()">Fechar</button>
            </div>
        </div>
    </dialog>

    <script src="assets/js/partes/menu.js"></script>
    <script src="assets/js/modal/modal.js"></script>
    <script src="assets/js/calendario/calendario.js"></script>
</body>

</html>
