<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/calendario/calendario.css">
    <title>Calendário</title>
</head>

<body>
    <header id="header"></header>
    <aside id="aside"></aside>

    <main>
        <section class="calendar-page">

            <div class="calendar-page-header">
                <div class="calendar-title">
                    <h1>Calendário</h1>
                    <span class="subtitle">Visualize suas reservas</span>
                </div>

                <div class="calendar-nav">
                    <button onclick="mudarMes(-1)">&#8249;</button>
                    <span id="mesLabel"></span>
                    <button onclick="mudarMes(1)">&#8250;</button>
                </div>
            </div>

            <div class="calendar-grid-wrapper">
                <div class="week-header">
                    <span>Dom</span>
                    <span>Seg</span>
                    <span>Ter</span>
                    <span>Qua</span>
                    <span>Qui</span>
                    <span>Sex</span>
                    <span>Sáb</span>
                </div>

                <div id="calendar"></div>
            </div>

        </section>
    </main>

    <dialog id="viewModal">
        <span autofocus style="position:absolute; opacity:0; pointer-events:none;"></span>
        <div class="modal-header">
            <h3 class="modal-title" id="titulo"></h3>
            <button class="close-modal" type="button" onclick="fecharView()">
                <img src="assets/icons/close-menu.svg" alt="Fechar">
            </button>
        </div>

        <div class="modal-body">
            <div class="detail-row">
                <span class="detail-label">Horário</span>
                <span class="detail-value" id="horario"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Responsável</span>
                <span class="detail-value" id="respView"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Capacidade</span>
                <span class="detail-value" id="capacidadeView"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Área / Local</span>
                <span class="detail-value" id="areaView"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" id="statusView"></span>
            </div>

            <p class="horarios-title">Convidados</p>
            <div id="listaEmails"></div>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="fecharView()">Fechar</button>
        </div>
    </dialog>

    <script src="assets/js/partes/menu.js"></script>
    <script src="assets/js/modal/modal.js"></script>
    <script src="assets/js/calendario/calendario.js"></script>
</body>

</html>
