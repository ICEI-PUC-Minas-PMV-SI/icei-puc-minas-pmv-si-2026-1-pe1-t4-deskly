<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/global/global.css">
  <link rel="stylesheet" href="assets/css/pages/login/login.css">
</head>

<body>

  <div class="login-wrapper">

    <div class="login-banner" aria-hidden="true"></div>

    <div class="login-form">
      <img src="assets/icons/logo.svg" alt="Logo" class="logo">

      <h2>Seja Bem vindo(a)!</h2>

      <form id="formLogin">

        <div class="field">
          <label for="email">Login</label>
          <input type="text" id="email" name="email" autocomplete="username" required placeholder="Digite seu e-mail">
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
            placeholder="Digite sua senha">
        </div>

        <div class="form-options">
          <label class="toggle">
            <input type="checkbox" id="lembrar" name="lembrar">
            <span class="slider"></span>
            <span>Lembre de mim</span>
          </label>
        </div>

        <button type="submit">Entrar</button>

      </form>

      <div class="login-info">
        <span class="login-info-titulo">Acesso somente por convite</span>
        <span class="login-info-texto">
          O acesso à plataforma é liberado apenas para usuários convidados pelo administrador.
          Se você já recebeu um convite, verifique sua caixa de e-mail (incluindo spam ou lixo eletrônico)
          e siga o link para ativar sua conta antes de fazer login.
        </span>
      </div>

    </div>

  </div>

  <script src="assets/js/login/login.js"></script>

</body>

</html>
