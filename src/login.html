<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/global/global.css">
  <link rel="stylesheet" href="assets/css/pages/login/login.css">
</head>
<body>

  <div class="login-wrapper">

    <div class="login-banner" aria-hidden="true">
      <img src="assets/img/banner-login.jpg" alt="">
    </div>

    <div class="login-form">
      <img src="assets/icons/logo.svg" alt="Logo" class="logo">

      <h2>Seja Bem vindo(a)!</h2>

      <form action="dashboard.html" method="get">

        <div class="field">
          <label for="email">Login</label>
          <input type="text" id="email" name="email" autocomplete="username" required placeholder="Digite seu e-mail">
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Digite sua senha">
        </div>

        <div class="form-options">
          <label class="toggle">
            <input type="checkbox" id="lembrar" name="lembrar">
            <span class="slider"></span>
            <span>Lembre de mim</span>
          </label>
          <a href="recuperar-senha.html">Esqueceu sua senha?</a>
        </div>

        <button type="submit">Entrar</button>

      </form>
    </div>

  </div>

</body>
</html>
