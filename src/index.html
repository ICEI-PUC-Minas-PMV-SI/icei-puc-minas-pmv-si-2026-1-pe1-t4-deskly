<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deskly</title>
  <link rel="stylesheet" href="assets/css/global/global.css">
  <link rel="stylesheet" href="assets/css/pages/index/index.css">
</head>
<body>

  <video autoplay muted loop playsinline>
    <source src="assets/videos/index-background.mp4" type="video/mp4">
  </video>

  <div class="scene">
    <div class="card">

      <img src="assets/icons/logo.svg" alt="Logo">

      <h2>Seja Bem vindo(a)!</h2>
      <p>Escolha uma forma de cadastro</p>

      <button onclick="selecionarPerfil('Usuário')">Usuário</button>
      <button onclick="selecionarPerfil('Admin')">Administrador</button>

    </div>
  </div>

  <script>
    function selecionarPerfil(perfil) {
      localStorage.setItem("perfilSelecionado", perfil);
      window.location.href = "cadastro.html";
    }
  </script>

</body>
</html>
