<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/perfil/perfil.css">

    <title>Meu Perfil</title>
</head>

<body>
    <header id="header"></header>
    <aside id="aside"></aside>

    <main>
        <div class="perfil-header">
            <div class="titulos">
                <h1>Meu Perfil</h1>
                <p>Gerencie suas informações pessoais e preferências do sistema</p>
            </div>
        </div>

        <section class="perfil-container">
            <div class="perfil-sidebar">
                <div class="card-perfil-resumo">
                    <div class="avatar-container">
                        <div class="perfil-avatar-placeholder">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <button class="btn-alterar-foto">
                            <img src="assets/icons/camera.svg" alt="Alterar foto">
                        </button>
                    </div>
                    <h2>—</h2>
                    <p class="user-role">—</p>
                    <span class="badge disponivel">—</span>
                </div>
            </div>

            <div class="perfil-conteudo">
                <div class="card-perfil-dados">
                    <h3 class="secao-titulo">Informações Pessoais</h3>

                    <form class="perfil-form">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nome">
                            </div>
                            <div class="input-group">
                                <label for="email">E-mail Corporativo</label>
                                <input type="email" id="email" disabled>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="departamento">Departamento</label>
                                <input type="text" id="departamento" disabled>
                            </div>
                            <div class="input-group">
                                <label for="telefone">Telefone</label>
                                <input type="text" id="telefone">
                            </div>
                        </div>

                        <h3 class="secao-titulo" style="margin-top: var(--spacing-lg);">Segurança</h3>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="senha-atual">Senha Atual</label>
                                <input type="password" id="senha-atual" placeholder="••••••••">
                            </div>
                            <div class="input-group">
                                <label for="nova-senha">Nova Senha</label>
                                <input type="password" id="nova-senha" placeholder="Nova senha">
                            </div>
                        </div>

                        <div class="form-acoes">
                            <button type="button" class="btn-detalhes">Descartar alterações</button>
                            <button type="submit" class="btn-reservar">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script src="assets/js/partes/menu.js"></script>
    <script src="assets/js/partes/notificacoes.js"></script>
    <script src="assets/js/perfil/perfil.js"></script>
</body>

</html>
