<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:5500; connect-src 'self' http://127.0.0.1:5500; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/primeiro-acesso/primeiro-acesso.css">
    <title>Primeiro Acesso</title>
</head>

<body>

    <div class="primeiroacesso-wrapper">

        <div class="primeiroacesso-banner" aria-hidden="true"></div>

        <div class="primeiroacesso-form">

            <img src="assets/icons/logo.svg" alt="Logo" class="primeiroacesso-logo">

            <h2>Primeiro Acesso</h2>

            <form>

                <div class="primeiroacesso-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>

                <div class="primeiroacesso-field">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="primeiroacesso-field">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" required placeholder="Digite sua nova senha">
                </div>

                <div class="primeiroacesso-field">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required
                        placeholder="Confirme sua senha">
                </div>

                <button type="submit" class="primeiroacesso-button">
                    Confirmar
                </button>

            </form>

        </div>

    </div>

    <script src="assets/js/primeiro-acesso/primeiro-acesso.js"></script>

</body>

</html>
