<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>

  <link rel="stylesheet" href="assets/css/global/global.css">
  <link rel="stylesheet" href="assets/css/pages/login/login.css">

  <style>
    #toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      min-width: 300px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--color-background);
      border: 1px solid var(--color-border-card);
      box-shadow: 0 10px 30px rgba(33, 42, 62, 0.16);
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: aparecerToast 0.3s ease;
    }

    .toast strong {
      color: var(--color-heading);
      font-size: 15px;
      font-weight: 700;
    }

    .toast span {
      color: var(--color-text-md);
      font-size: 13px;
    }

    .toast.sucesso {
      border-left: 5px solid #22c55e;
    }

    .toast.erro {
      border-left: 5px solid #ef4444;
    }

    @keyframes aparecerToast {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 480px) {
      #toast-container {
        top: 16px;
        right: 16px;
        left: 16px;
      }

      .toast {
        min-width: unset;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-banner" aria-hidden="true"></div>

    <div class="login-form">
      <img src="assets/icons/logo.svg" alt="Logo" class="logo">

      <h2 id="tituloCadastro">Crie sua conta</h2>

      <form id="formCadastro">

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" required placeholder="Digite seu nome">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="Digite seu e-mail">
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="Crie uma senha">
        </div>

        <button type="submit">Cadastrar</button>

        <p style="margin-top: 16px; text-align: center;">
          Já tem conta?
          <a href="login.html">Entrar</a>
        </p>

      </form>
    </div>

  </div>

  <div id="toast-container"></div>

  <script>
    const formCadastro = document.getElementById("formCadastro");
    const tituloCadastro = document.getElementById("tituloCadastro");

    const perfilSelecionado = localStorage.getItem("perfilSelecionado") || "Usuário";

    tituloCadastro.textContent =
      perfilSelecionado === "Admin"
        ? "Cadastro Administrador"
        : "Cadastro Usuário";

    function mostrarToast(titulo, mensagem, tipo = "sucesso") {
      const container = document.getElementById("toast-container");

      const toast = document.createElement("div");
      toast.className = `toast ${tipo}`;

      toast.innerHTML = `
        <strong>${titulo}</strong>
        <span>${mensagem}</span>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    formCadastro.addEventListener("submit", function(event) {
      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("password").value.trim();

      if (!nome || !email || !senha) {
        mostrarToast(
          "Campos obrigatórios",
          "Preencha todos os campos para continuar.",
          "erro"
        );
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      const emailJaExiste = usuarios.some(usuario => usuario.email === email);

      if (emailJaExiste) {
        mostrarToast(
          "E-mail já cadastrado",
          "Já existe uma conta utilizando esse e-mail.",
          "erro"
        );
        return;
      }

      const novoUsuario = {
        id: Date.now(),
        nome: nome,
        email: email,
        senha: senha,
        perfil: perfilSelecionado
      };

      usuarios.push(novoUsuario);

      localStorage.setItem("usuarios", JSON.stringify(usuarios));

      mostrarToast(
        "Cadastro realizado",
        "Sua conta foi criada com sucesso.",
        "sucesso"
      );

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>

</body>
</html>
