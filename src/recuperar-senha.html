<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/global/global.css">
    <link rel="stylesheet" href="assets/css/pages/recuperar-senha/recuperar-senha.css">
    <title>Recuperar Senha</title>
</head>

<body>

    <div class="recuperarsenha-wrapper">

        <div class="recuperarsenha-banner" aria-hidden="true"></div>

        <div class="recuperarsenha-form">

            <img src="assets/icons/logo.svg" alt="Logo" class="recuperarsenha-logo">

            <h2>Recuperação de Senha</h2>

            <form>

                <div class="recuperarsenha-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>

                <div class="recuperarsenha-field">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" required placeholder="Digite sua nova senha">
                </div>

                <div class="recuperarsenha-field">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required placeholder="Confirme sua senha">
                </div>

                <button type="submit" class="recuperarsenha-button">
                    Confirmar
                </button>

            </form>

        </div>

    </div>

    <script src="assets/js/recuperar-senha/recuperar-senha.js"></script>

</body>

</html>
